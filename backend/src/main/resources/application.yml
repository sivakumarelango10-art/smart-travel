# SmartTravel Platform Configuration
spring:
  application:
    name: smarttravel-backend
  profiles:
    active: dev

server:
  port: 8080
  servlet:
    context-path: /

# App-specific Configurations
app:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLXNhbXBsZS01MTItYml0LXNlY3JldC1rZXktZm9yLXVzZS13aXRoLWpqd3Qtc21hcnR0cmF2ZWwtYXBwbGljYXRpb24tZGV2ZWxvcG1lbnQtdGVzdGluZw==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  pricing:
    default-freeze-duration-minutes: ${PRICE_FREEZE_DURATION_MINUTES:30}
    max-demand-multiplier: 2.0
    holiday-surge-percentage: 20.0
  scheduler:
    mock-flight-update-interval-ms: 15000 # 15 seconds
    price-freeze-cleanup-interval-ms: 60000 # 1 minute
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

smarttravel:
  flight:
    simulation:
      enabled: ${FLIGHT_SIMULATION_ENABLED:false}
      interval-ms: ${FLIGHT_SIMULATION_INTERVAL_MS:5000}
      default-speed: ${FLIGHT_SIMULATION_SPEED:60}
      delay-probability: ${FLIGHT_SIMULATION_DELAY_PROBABILITY:0.25}
      min-delay-minutes: ${FLIGHT_SIMULATION_MIN_DELAY:15}
      max-delay-minutes: ${FLIGHT_SIMULATION_MAX_DELAY:120}
  booking:
    payment-timeout-minutes: ${BOOKING_PAYMENT_TIMEOUT_MINUTES:15}
    expiration:
      enabled: ${BOOKING_EXPIRATION_ENABLED:false}
      fixed-delay-ms: ${BOOKING_EXPIRATION_FIXED_DELAY_MS:60000}
  payment:
    razorpay:
      enabled: ${RAZORPAY_ENABLED:false}
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      currency: ${RAZORPAY_CURRENCY:INR}

# Actuator Management & Health Probes
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    mongo:
      enabled: true

# Logging Configuration
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%15.15t] [%X{requestId}] %-40.40logger{39} : %m%n"

# OpenAPI / Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
