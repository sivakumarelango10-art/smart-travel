# ==============================================================================
# SmartTravel Platform — Render Blueprint Deployment Specification
# ==============================================================================

services:
  # Backend Spring Boot Web Service
  - type: web
    name: smarttravel-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: 8080
      - key: MONGODB_URI
        sync: false # Set securely in Render dashboard
      - key: MONGODB_DATABASE
        value: smarttravel
      - key: JWT_SECRET
        sync: false # Generate base64 512-bit key and set in Render dashboard
      - key: CORS_ALLOWED_ORIGINS
        sync: false # Set to Vercel production frontend domain
      - key: RAZORPAY_ENABLED
        value: "true"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SWAGGER_UI_ENABLED
        value: "false"
      - key: SWAGGER_API_DOCS_ENABLED
        value: "false"
