<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="SmartTravel Platform - Real-time Flights, Hotels, Dynamic Pricing, Seat Maps, and Recommendations" />
    <title>SmartTravel Platform | Modern Travel Booking</title>
    <!-- PWA & Mobile Web App Capabilities (iOS, Android, Windows, Safari) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SmartTravel" />
    <meta name="application-name" content="SmartTravel" />
    <meta name="msapplication-TileColor" content="#020617" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />
    <!-- Proactive Cloud Backend Preconnect & Standby Wakeup -->
    <link rel="dns-prefetch" href="https://smarttravel-backend-6qkl.onrender.com" />
    <link rel="preconnect" href="https://smarttravel-backend-6qkl.onrender.com" crossorigin />
    <script>
      // Non-blocking zero-overhead background ping to awaken cloud container from standby
      (function() {
        try {
          if (window.fetch) {
            window.fetch('https://smarttravel-backend-6qkl.onrender.com/v1/health', {
              mode: 'no-cors',
              cache: 'no-cache',
              priority: 'low'
            }).catch(function() {});
          }
        } catch (e) {}
      })();
    </script>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Browser Polyfill for CommonJS / SockJS global object -->
    <script>
      if (typeof window.global === 'undefined') {
        window.global = window;
      }
    </script>
    <!-- Razorpay Checkout SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
